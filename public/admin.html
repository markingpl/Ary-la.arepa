<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Salchi Brutales</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-stone-950 text-white min-h-screen">

  <!-- Pantalla de Bloqueo PIN Pad -->
  <div id="pin-screen" class="fixed inset-0 z-50 bg-stone-950 flex flex-col items-center justify-center p-4">
    <div class="max-w-xs w-full text-center space-y-6">
      <div>
        <h1 class="text-2xl font-black text-amber-400">SALCHI BRUTALES</h1>
        <p class="text-xs text-stone-400 font-bold uppercase tracking-widest mt-1">ACCESO AL PANEL</p>
      </div>

      <div class="flex justify-center gap-3 my-4">
        <span class="w-4 h-4 rounded-full border border-stone-600 pin-dot"></span>
        <span class="w-4 h-4 rounded-full border border-stone-600 pin-dot"></span>
        <span class="w-4 h-4 rounded-full border border-stone-600 pin-dot"></span>
        <span class="w-4 h-4 rounded-full border border-stone-600 pin-dot"></span>
      </div>

      <!-- Teclado Numérico -->
      <div class="grid grid-cols-3 gap-3">
        <button onclick="pressPin('1')" class="h-14 bg-stone-900 border border-stone-800 rounded-2xl font-bold text-lg hover:bg-stone-800">1</button>
        <button onclick="pressPin('2')" class="h-14 bg-stone-900 border border-stone-800 rounded-2xl font-bold text-lg hover:bg-stone-800">2</button>
        <button onclick="pressPin('3')" class="h-14 bg-stone-900 border border-stone-800 rounded-2xl font-bold text-lg hover:bg-stone-800">3</button>
        <button onclick="pressPin('4')" class="h-14 bg-stone-900 border border-stone-800 rounded-2xl font-bold text-lg hover:bg-stone-800">4</button>
        <button onclick="pressPin('5')" class="h-14 bg-stone-900 border border-stone-800 rounded-2xl font-bold text-lg hover:bg-stone-800">5</button>
        <button onclick="pressPin('6')" class="h-14 bg-stone-900 border border-stone-800 rounded-2xl font-bold text-lg hover:bg-stone-800">6</button>
        <button onclick="pressPin('7')" class="h-14 bg-stone-900 border border-stone-800 rounded-2xl font-bold text-lg hover:bg-stone-800">7</button>
        <button onclick="pressPin('8')" class="h-14 bg-stone-900 border border-stone-800 rounded-2xl font-bold text-lg hover:bg-stone-800">8</button>
        <button onclick="pressPin('9')" class="h-14 bg-stone-900 border border-stone-800 rounded-2xl font-bold text-lg hover:bg-stone-800">9</button>
        <button onclick="pressPin('C')" class="h-14 bg-stone-900 border border-stone-800 rounded-2xl font-bold text-sm text-stone-400">⌫</button>
        <button onclick="pressPin('0')" class="h-14 bg-stone-900 border border-stone-800 rounded-2xl font-bold text-lg hover:bg-stone-800">0</button>
        <button onclick="checkPin()" class="h-14 bg-red-600 rounded-2xl font-bold text-lg hover:bg-red-700">✓</button>
      </div>
      <p id="pin-error" class="text-xs text-red-500 font-bold hidden">PIN incorrecto (Prueba: 1234)</p>
    </div>
  </div>

  <!-- Dashboard Principal -->
  <div class="flex h-screen overflow-hidden">
    <!-- Sidebar -->
    <aside class="w-64 bg-stone-900 border-r border-stone-800 p-4 flex flex-col justify-between hidden md:flex">
      <div class="space-y-6">
        <div>
          <h2 class="font-black text-amber-400 tracking-wider">SALCHI BRUTALES</h2>
          <span class="text-[10px] text-stone-400 uppercase">Panel de Control</span>
        </div>
        <nav class="space-y-1 text-xs">
          <a href="#" class="flex items-center gap-3 p-3 bg-red-600/10 text-red-500 font-bold rounded-xl"><i class="fa-solid fa-chart-pie"></i> Dashboard</a>
          <a href="/cocina.html" target="_blank" class="flex items-center gap-3 p-3 text-stone-400 hover:bg-stone-800 rounded-xl"><i class="fa-solid fa-fire"></i> KDS Cocina</a>
          <a href="/" target="_blank" class="flex items-center gap-3 p-3 text-stone-400 hover:bg-stone-800 rounded-xl"><i class="fa-solid fa-eye"></i> Vista Cliente</a>
        </nav>
      </div>
      <button onclick="location.reload()" class="p-3 bg-stone-800 text-stone-400 hover:text-white rounded-xl text-xs font-bold flex items-center gap-2">
        <i class="fa-solid fa-right-from-bracket"></i> Bloquear panel
      </button>
    </aside>

    <!-- Contenido -->
    <main class="flex-1 overflow-y-auto p-6">
      <div class="flex justify-between items-center mb-6">
        <h1 class="text-2xl font-black">Dashboard General</h1>
        <div class="text-xs text-stone-400 font-semibold" id="fecha-hoy"></div>
      </div>

      <!-- Tarjetas Métricas -->
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-8">
        <div class="bg-stone-900 border border-stone-800 p-5 rounded-2xl">
          <div class="text-xs text-stone-400 font-bold">Ventas Totales Hoy</div>
          <div class="text-2xl font-black text-green-400 mt-2" id="dash-ventas">$0</div>
        </div>
        <div class="bg-stone-900 border border-stone-800 p-5 rounded-2xl">
          <div class="text-xs text-stone-400 font-bold">Pedidos Registrados</div>
          <div class="text-2xl font-black text-amber-400 mt-2" id="dash-pedidos">0</div>
        </div>
        <div class="bg-stone-900 border border-stone-800 p-5 rounded-2xl">
          <div class="text-xs text-stone-400 font-bold">Domicilios Realizados</div>
          <div class="text-2xl font-black text-blue-400 mt-2" id="dash-domicilios">0</div>
        </div>
      </div>

      <!-- Tabla Pedidos Recientes -->
      <div class="bg-stone-900 border border-stone-800 rounded-2xl overflow-hidden">
        <div class="p-4 border-b border-stone-800 font-bold text-sm">Historial de Pedidos</div>
        <div class="overflow-x-auto">
          <table class="w-full text-left text-xs">
            <thead class="bg-stone-800/50 text-stone-400 uppercase text-[10px]">
              <tr>
                <th class="p-3">#</th>
                <th class="p-3">Hora</th>
                <th class="p-3">Cliente</th>
                <th class="p-3">Modalidad</th>
                <th class="p-3">Total</th>
                <th class="p-3">Estado</th>
              </tr>
            </thead>
            <tbody id="tabla-pedidos" class="divide-y divide-stone-800"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script>
    let currentPin = '';
    const CORRECT_PIN = '1234';

    function pressPin(val) {
      if (val === 'C') currentPin = currentPin.slice(0, -1);
      else if (currentPin.length < 4) currentPin += val;
      updateDots();
      if (currentPin.length === 4) checkPin();
    }

    function updateDots() {
      const dots = document.querySelectorAll('.pin-dot');
      dots.forEach((dot, idx) => {
        dot.className = idx < currentPin.length 
          ? 'w-4 h-4 rounded-full bg-red-600 pin-dot' 
          : 'w-4 h-4 rounded-full border border-stone-600 pin-dot';
      });
    }

    function checkPin() {
      if (currentPin === CORRECT_PIN) {
        document.getElementById('pin-screen').classList.add('hidden');
        cargarDashboard();
      } else {
        document.getElementById('pin-error').classList.remove('hidden');
        currentPin = '';
        updateDots();
      }
    }

    async function cargarDashboard() {
      document.getElementById('fecha-hoy').innerText = new Date().toLocaleDateString('es-CO', { dateStyle: 'long' });
      const res = await fetch('/api/pedidos');
      const pedidos = await res.json();

      const totalVentas = pedidos.reduce((acc, p) => acc + p.total, 0);
      const domicilios = pedidos.filter(p => p.modalidad === 'Domicilio').length;

      document.getElementById('dash-ventas').innerText = `$${totalVentas.toLocaleString()}`;
      document.getElementById('dash-pedidos').innerText = pedidos.length;
      document.getElementById('dash-domicilios').innerText = domicilios;

      document.getElementById('tabla-pedidos').innerHTML = pedidos.map(p => `
        <tr>
          <td class="p-3 font-bold text-amber-400">${p.numero}</td>
          <td class="p-3 text-stone-400">${p.fecha}</td>
          <td class="p-3 font-semibold">${p.cliente.nombre}</td>
          <td class="p-3">${p.modalidad}</td>
          <td class="p-3 font-black text-stone-100">$${p.total.toLocaleString()}</td>
          <td class="p-3"><span class="px-2 py-0.5 rounded-full text-[10px] font-bold ${p.estado === 'PENDIENTE' ? 'bg-red-950 text-red-400' : 'bg-green-950 text-green-400'}">${p.estado}</span></td>
        </tr>
      `).join('');
    }
  </script>
</body>
</html>
