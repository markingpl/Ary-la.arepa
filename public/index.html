<!-- Modal Pago QR Bre-B / Nequi / Transferencia -->
  <div id="modal-pago-nequi" class="fixed inset-0 z-50 bg-black/95 hidden flex items-center justify-center p-3 overflow-y-auto">
    <div class="bg-stone-900 border-2 border-yellow-500 rounded-3xl p-5 max-w-sm w-full text-center space-y-3.5 shadow-2xl my-auto">
      
      <!-- Cabecera -->
      <div class="flex items-center justify-center gap-2">
        <span class="bg-yellow-400 text-black text-[10px] font-black px-2.5 py-1 rounded-full uppercase tracking-wider">Bre-B Interoperable</span>
        <span class="bg-fuchsia-950 text-fuchsia-400 border border-fuchsia-700 text-[10px] font-black px-2.5 py-1 rounded-full uppercase">Nequi</span>
      </div>

      <div>
        <h3 class="text-xl font-black text-white uppercase tracking-tight">Paga al Instante</h3>
        <p class="text-[11px] text-stone-400">Escanea desde cualquier app bancaria o Nequi:</p>
      </div>

      <!-- Total destacado -->
      <div class="bg-neutral-950 border border-stone-800 p-2.5 rounded-2xl flex justify-between items-center px-4">
        <span class="text-xs text-stone-400 font-bold uppercase">Monto a pagar:</span>
        <span id="nequi-monto-total" class="text-2xl font-black text-yellow-400">$0</span>
      </div>

      <!-- Imagen del QR Bre-B / Nequi -->
      <div class="bg-white p-3 rounded-2xl mx-auto w-52 h-52 flex items-center justify-center shadow-lg border-2 border-stone-700">
        <img id="img-qr-pago" src="/img/qr-pago.png" onerror="intentarCargarQR(this)" alt="QR Bre-B Nequi" class="w-full h-full object-contain">
      </div>
      <p class="text-[10px] text-stone-400">Compatible con Nequi, Bancolombia, Daviplata y Bre-B</p>

      <!-- Botones Rápidos para Celular -->
      <div class="space-y-2 pt-1 text-xs">
        
        <!-- Guardar QR en Galería (Para escanear desde la app) -->
        <a id="btn-descargar-qr" href="/img/qr-pago.png" download="QR-Ary-La-Arepa.png" class="w-full bg-neutral-800 hover:bg-neutral-700 border border-stone-700 text-stone-200 py-2.5 rounded-xl font-bold flex items-center justify-center gap-2 transition">
          <i class="fa-solid fa-download text-yellow-400"></i> Guardar QR para leer desde Galería
        </a>

        <!-- Botones Nequi y Copiar Llave -->
        <div class="grid grid-cols-2 gap-2">
          <button onclick="copiarNequi()" class="bg-neutral-800 hover:bg-neutral-700 border border-stone-700 text-stone-200 py-2.5 rounded-xl font-bold flex items-center justify-center gap-1.5 transition">
            <i class="fa-regular fa-copy text-fuchsia-400"></i> Copiar Llave/Cel
          </button>
          
          <a href="nequi://" class="bg-fuchsia-700 hover:bg-fuchsia-600 text-white py-2.5 rounded-xl font-black flex items-center justify-center gap-1.5 transition">
            <i class="fa-solid fa-arrow-up-right-from-square"></i> Abrir Nequi
          </a>
        </div>

        <!-- Botón Enviar Comprobante por WhatsApp -->
        <a id="btn-whatsapp-comprobante" href="#" target="_blank" class="w-full bg-green-600 hover:bg-green-500 text-white py-3 rounded-xl font-black text-xs uppercase flex items-center justify-center gap-2 shadow-lg shadow-green-900/40 transition">
          <i class="fa-brands fa-whatsapp text-base"></i> Ya pagué • Enviar Comprobante
        </a>
      </div>

      <!-- Continuar al seguimiento -->
      <button onclick="irASeguimiento()" class="text-[11px] text-stone-400 hover:text-white font-bold underline block mx-auto pt-1">
        Ver el estado de mi comanda →
      </button>
    </div>
  </div>
