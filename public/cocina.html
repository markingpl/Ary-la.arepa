<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cocina - Ary la arepa</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/socket.io/socket.io.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-neutral-950 text-white min-h-screen p-4 font-sans select-none">
  
  <header class="flex flex-wrap justify-between items-center gap-3 pb-4 border-b border-stone-800">
    <div class="flex items-center gap-3">
      <img src="/img/mascota.png" onerror="this.src='https://placehold.co/40x40/facc15/000?text=Ary'" class="w-10 h-10 object-contain">
      <div>
        <h1 class="text-base font-black text-yellow-400 leading-tight">ARY LA AREPA • COCINA KDS</h1>
        <p class="text-[10px] text-stone-400">Control de comandas en tiempo real</p>
      </div>
      <span id="contador-pendientes" class="ml-2 bg-red-600 text-white text-xs px-3 py-1 rounded-full font-black animate-pulse">
        0 Pendientes
      </span>
    </div>

    <div class="flex flex-wrap gap-2">
      <button onclick="setFiltro('TODOS')" id="f-TODOS" class="px-3.5 py-1.5 rounded-xl text-xs font-black bg-yellow-400 text-black">
        Todos (<span id="c-todos">0</span>)
      </button>
      <button onclick="setFiltro('PENDIENTE')" id="f-PENDIENTE" class="px-3.5 py-1.5 rounded-xl text-xs font-bold bg-neutral-900 border border-stone-800 text-stone-300">
        Pendientes (<span id="c-pendientes">0</span>)
      </button>
      <button onclick="setFiltro('PREPARANDO')" id="f-PREPARANDO" class="px-3.5 py-1.5 rounded-xl text-xs font-bold bg-neutral-900 border border-stone-800 text-stone-300">
        En Preparación (<span id="c-preparando">0</span>)
      </button>
      <button onclick="setFiltro('LISTO')" id="f-LISTO" class="px-3.5 py-1.5 rounded-xl text-xs font-bold bg-neutral-900 border border-stone-800 text-stone-300">
        Listos para Entrega (<span id="c-listos">0</span>)
      </button>
    </div>
  </header>

  <main class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 mt-6" id="grid-comandas">
    <div class="col-span-full text-center py-16 text-stone-500 italic">
      Esperando pedidos... Las comandas aparecerán aquí al instante.
    </div>
  </main>

  <script>
    const socket = io();
    let pedidos = [];
    let filtroActual = 'TODOS';

    function reproducirAlarma() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.8);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.8);
      } catch (e) {}
    }

    async function cargarPedidos() {
      try {
        const res = await fetch('/api/pedidos');
        pedidos = await res.json();
        renderComandas();
      } catch (err) {
        console.error("Error al cargar pedidos:", err);
      }
    }

    function setFiltro(f) {
      filtroActual = f;
      document.querySelectorAll('#f-TODOS, #f-PENDIENTE, #f-PREPARANDO, #f-LISTO').forEach(btn => {
        btn.className = 'px-3.5 py-1.5 rounded-xl text-xs font-bold bg-neutral-900 border border-stone-800 text-stone-300';
      });
      document.getElementById(`f-${f}`).className = 'px-3.5 py-1.5 rounded-xl text-xs font-black bg-yellow-400 text-black';
      renderComandas();
    }

    function renderComandas() {
      const grid = document.getElementById('grid-comandas');
      // Filtramos cualquier pedido cancelado o entregado para que desaparezcan de la pantalla
      const activos = pedidos.filter(p => p.estado !== 'ENTREGADO' && p.estado !== 'CANCELADO');

      const nPendientes = pedidos.filter(p => p.estado === 'PENDIENTE').length;
      const nPreparando = pedidos.filter(p => p.estado === 'PREPARANDO').length;
      const nListos = pedidos.filter(p => p.estado === 'LISTO').length;

      document.getElementById('c-todos').innerText = activos.length;
      document.getElementById('c-pendientes').innerText = nPendientes;
      document.getElementById('c-preparando').innerText = nPreparando;
      document.getElementById('c-listos').innerText = nListos;
      document.getElementById('contador-pendientes').innerText = `${nPendientes} Pendientes`;

      const filtrados = filtroActual === 'TODOS' ? activos : activos.filter(p => p.estado === filtroActual);

      if (filtrados.length === 0) {
        grid.innerHTML = `<div class="col-span-full text-center py-16 text-stone-500 italic">No hay comandas activas en esta sección.</div>`;
        return;
      }

      grid.innerHTML = filtrados.map(p => {
        const mins = Math.floor((Date.now() - (p.timestamp || Date.now())) / 60000);
        let colorBorde = p.estado === 'PENDIENTE' ? 'border-red-600/70' : (p.estado === 'PREPARANDO' ? 'border-blue-500/70' : 'border-green-500/70');
        let colorBadge = p.estado === 'PENDIENTE' ? 'bg-red-600 text-white' : (p.estado === 'PREPARANDO' ? 'bg-blue-600 text-white' : 'bg-green-500 text-black');

        return `
          <div class="bg-neutral-900 border-2 ${colorBorde} rounded-2xl flex flex-col justify-between overflow-hidden shadow-xl">
            <div>
              <div class="flex justify-between items-center p-3 border-b border-stone-800 bg-neutral-950">
                <span class="text-3xl font-black text-yellow-400 tracking-wider">${p.numero}</span>
                <span class="text-[10px] font-black px-2.5 py-0.5 rounded-full ${colorBadge} uppercase">${p.estado}</span>
                <span class="text-xs text-stone-400"><i class="fa-regular fa-clock"></i> ${mins} min</span>
              </div>

              <div class="p-3 text-xs border-b border-stone-800 bg-neutral-900/60">
                <div class="font-black text-white uppercase text-sm">${p.modalidad} • ${p.cliente ? p.cliente.nombre : 'Cliente'}</div>
                <div class="text-stone-300 text-[11px] mt-0.5">${p.cliente ? p.cliente.direccion : ''} ${p.cliente && p.cliente.barrio ? `(${p.cliente.barrio})` : ''}</div>
                ${p.cliente && p.cliente.celular ? `<div class="text-[10px] text-stone-400 mt-0.5"><i class="fa-solid fa-phone text-yellow-400"></i> ${p.cliente.celular}</div>` : ''}
              </div>

              <div class="p-3 space-y-3">
                ${(p.items || []).map(it => `
                  <div class="border-b border-stone-800/60 pb-3">
                    <div class="font-black text-lg text-yellow-400">1x ${it.nombre}</div>
                    
                    ${it.extras && it.extras.length ? `
                      <div class="mt-1.5 p-2 bg-yellow-400/10 border-l-4 border-yellow-400 rounded-r-xl">
                        <span class="text-[10px] font-black text-yellow-400 uppercase tracking-widest block mb-0.5">⭐ EXTRAS SOLICITADOS:</span>
                        <div class="text-sm font-black text-stone-100 leading-snug">
                          ${it.extras.map(e => typeof e === 'object' ? e.nombre : e).join(' • ')}
                        </div>
                      </div>
                    ` : ''}

                    ${it.notas ? `
                      <div class="text-xs text-amber-200 bg-amber-950/50 border border-amber-600/50 p-2 rounded-xl mt-1.5 font-bold">
                        ⚠️ <span class="uppercase font-black text-amber-400">Nota Cocina:</span> ${it.notas}
                      </div>
                    ` : ''}
                  </div>
                `).join('')}
              </div>
            </div>

            <div class="p-3 border-t border-stone-800 bg-neutral-950 space-y-2">
              ${p.estado === 'PENDIENTE' ? `
                <div class="flex gap-2">
                  <button onclick="cancelarComanda('${p.id}', '${p.numero}')" class="px-3 py-3 bg-red-950 hover:bg-red-900 border border-red-700 text-red-400 rounded-xl text-xs font-bold transition flex items-center justify-center gap-1.5 shadow" title="Rechazar Comanda">
                    <i class="fa-solid fa-ban"></i> Rechazar
                  </button>
                  <button onclick="cambiarEstadoComanda('${p.id}', 'PREPARANDO')" class="flex-1 bg-blue-600 hover:bg-blue-500 py-3 rounded-xl text-xs font-black uppercase tracking-wider text-white shadow-lg transition flex items-center justify-center gap-1.5">
                    🔥 Comenzar a Preparar
                  </button>
                </div>
              ` : p.estado === 'PREPARANDO' ? `
                <div class="flex gap-2">
                  <button onclick="cancelarComanda('${p.id}', '${p.numero}')" class="px-3 py-3 bg-red-950 hover:bg-red-900 border border-red-700 text-red-400 rounded-xl text-xs font-bold" title="Cancelar Orden">
                    <i class="fa-solid fa-ban"></i>
                  </button>
                  <button onclick="cambiarEstadoComanda('${p.id}', 'LISTO')" class="flex-1 bg-yellow-400 hover:bg-yellow-300 py-3 rounded-xl text-xs font-black uppercase tracking-wider text-black shadow-lg transition">
                    ✓ Marcar Listo para Entrega
                  </button>
                </div>
              ` : p.estado === 'LISTO' ? `
                <button onclick="cambiarEstadoComanda('${p.id}', 'ENTREGADO')" class="w-full bg-green-600 hover:bg-green-500 py-3 rounded-xl text-xs font-black uppercase tracking-wider text-white shadow-lg transition">
                  🚀 Marcar como Entregado
                </button>
              ` : `
                <span class="block text-center text-xs font-bold text-stone-500 py-2">✓ Comanda Despachada</span>
              `}
            </div>
          </div>
        `;
      }).join('');
    }

    function cambiarEstadoComanda(id, nuevoEstado) {
      socket.emit('cambiar-estado', { id, nuevoEstado });
    }

    async function cancelarComanda(id, numero) {
      const motivo = prompt(
        `¿Por qué motivo cancelas o rechazas la orden ${numero}?\n(Ej: Insumos agotados, cliente canceló, fuera de cobertura):`, 
        'Insumos agotados en cocina'
      );
      
      if (motivo !== null) {
        const motivoLimpio = motivo.trim() || 'Cancelado por cocina';

        // 1. Emitir Socket
        socket.emit('cancelar-comanda-cocina', { id, motivo: motivoLimpio });

        // 2. Respaldo HTTP REST para asegurar desaparición inmediata
        try {
          await fetch(`/api/pedidos/${id}/cancelar`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ motivo: motivoLimpio })
          });
        } catch (e) {}

        // 3. Actualización de estado local inmediata para que no espere al socket
        const p = pedidos.find(x => x.id === id);
        if (p) {
          p.estado = 'CANCELADO';
          p.motivoCancelacion = motivoLimpio;
        }
        renderComandas();
      }
    }

    socket.on('pedido-creado', (p) => {
      pedidos.unshift(p);
      reproducirAlarma();
      renderComandas();
    });

    socket.on('estado-actualizado', ({ id, nuevoEstado, pedido }) => {
      const p = pedidos.find(x => x.id === id);
      if (p) {
        p.estado = nuevoEstado;
        if (pedido && pedido.motivoCancelacion) p.motivoCancelacion = pedido.motivoCancelacion;
      }
      renderComandas();
    });

    cargarPedidos();
    setInterval(cargarPedidos, 5000);
  </script>
</body>
</html>
